name: Aquafortus
description: >-
  Aquafortus Technologies is a New Zealand-based deep-tech water treatment
  company that develops patented non-thermal, zero-liquid-discharge (ZLD)
  desalination technology for high-salinity industrial brines. Its ABX system
  uses a solvent-extraction and membrane-filtration process at ambient
  temperatures to turn up to 98% of high-salinity brine into fresh water while
  using significantly less energy than thermal alternatives, and can expose,
  isolate and extract valuable metals and minerals (lithium, copper, magnesium
  salts and others) from the treated brine. The company targets cooling towers,
  mining, oil and gas, inland desalination, flue-gas desulphurisation and other
  high-volume, high-salinity industrial processes. Aquafortus is backed by deep
  tech venture firm DCVC and Novo Holdings, and was added to the API Evangelist
  network as a portfolio-lead stub; it publishes no public API or developer
  surface.
